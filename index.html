  <body>
    <div id="app"></div>
    <noscript>此页面需要启用 JavaScript。</noscript>

    <!-- 保留你原来的 Bilibili 播放器替换逻辑，但缩小监听范围并在成功后停止监听。 -->
    <script>
      (() => {
        const playerUrl =
          "https://player.bilibili.com/player.html?bvid=BV1BGosB6EnL&page=1";

        const applyPlayerUrl = () => {
          const iframe = document.querySelector("iframe.modal-youtube__iframe");
          if (!iframe) return false;
          if (iframe.src !== playerUrl) iframe.src = playerUrl;
          return true;
        };

        if (applyPlayerUrl()) return;

        const app = document.getElementById("app");
        if (!app) return;

        const observer = new MutationObserver(() => {
          if (applyPlayerUrl()) observer.disconnect();
        });
        observer.observe(app, { childList: true, subtree: true });
      })();
    </script>
  </body>
